[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "print-cards"
version = "0.1.0"
description = "Generate PDFs with images arranged in a grid for pre-cut sheets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "print", "cards", "grid", "images"]
dependencies = [
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
print-cards = "print_cards.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["print_cards*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
